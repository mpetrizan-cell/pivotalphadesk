<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GAIA Daily Zones — PivotAlphaDesk</title>
<style>
:root{--bg:#06101f;--panel:#0b1526;--line:#223149;--text:#f4f7fb;--muted:#a8b3c4;--cyan:#13d8ff;--yellow:#ffc928;--red:#ff5d67;--green:#35d07f;--orange:#ff9f43;--purple:#b98cff;--gray:#8390a3;--blue:#3a8ef0;}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#0b1b32 0,#06101f 45%,#030914 100%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.shell{max-width:1900px;margin:auto;padding:18px 20px 26px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:16px}.logo{font-size:28px;font-weight:900;letter-spacing:.12em;color:#76e7ff}.subtitle{font-size:12px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase}.livebox{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}.titleRow{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 0 14px;border-bottom:1px solid var(--line);padding-bottom:10px}.titleRow h1{margin:0;font-size:20px;letter-spacing:.08em}.titleRow span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:14px}.card{background:linear-gradient(180deg,rgba(15,27,47,.98),rgba(7,16,31,.98));border:1px solid var(--line);border-radius:14px;padding:14px;min-height:520px;box-shadow:0 10px 28px rgba(0,0,0,.23)}.card.no-data{opacity:.62}.cardTop{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}.symbol{font-size:13px;font-weight:900;letter-spacing:.08em;display:inline-block;padding:4px 10px;border-radius:6px;color:#06101f;}.symbol.SPX{background:var(--red)}.symbol.NDX{background:var(--blue)}.symbol.SPY{background:var(--green)}.symbol.QQQ{background:var(--purple)}.spot{font-size:27px;font-weight:900}.timestamp,.fresh{font-size:11px;color:var(--muted);margin-top:3px}.stale{color:var(--yellow)!important;font-weight:700}.regime{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.regimeBox{background:#111d31;border:1px solid var(--line);border-radius:8px;padding:8px}.regimeLabel{font-size:10px;color:var(--muted);text-transform:uppercase}.regimeVal{font-size:12px;font-weight:800;margin-top:4px}.agree{grid-column:1/-1;font-size:11px;font-weight:800;padding:7px 9px;border-radius:7px;text-align:center}.agree.ok{background:rgba(53,208,127,.14);color:var(--green);border:1px solid rgba(53,208,127,.32)}.agree.warn{background:rgba(255,201,40,.13);color:var(--yellow);border:1px solid rgba(255,201,40,.32)}.sectionTitle{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;margin:12px 0 7px}.rows{display:grid;gap:6px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 9px;background:#0d182a;border:1px solid #1d2b42;border-radius:8px}.row strong{font-size:12px}.row .v{font-size:16px;font-weight:900}.wall-call{border-left:4px solid var(--red)}.wall-put{border-left:4px solid var(--cyan)}.flip{border-left:4px solid var(--yellow)}.node{border-left:4px solid var(--purple)}.pin{border-left:4px solid var(--orange)}.dhp{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#0c1728;border:1px solid var(--line);border-radius:9px;padding:10px}.dhpVal{font-size:20px;font-weight:900}.dir{font-size:11px;font-weight:900;padding:5px 7px;border-radius:6px}.bull{background:rgba(53,208,127,.15);color:var(--green)}.bear{background:rgba(255,93,103,.15);color:var(--red)}.neutral{background:rgba(131,144,163,.14);color:#c3cad5}.eq{margin-top:10px;padding:10px;border-radius:9px;background:#111d31;border:1px solid #2d3e59}.eqLabel{font-size:10px;color:var(--muted);text-transform:uppercase}.eqVal{font-size:18px;font-weight:900;margin-top:4px}.secondary{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.sec{background:#0a1424;border:1px solid #1b2940;border-radius:7px;padding:7px 8px}.sec span{display:block;font-size:9px;color:var(--muted)}.sec strong{font-size:12px}footer{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:16px;padding:12px 2px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}.err{color:var(--red);font-weight:700}@media(max-width:1250px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{min-height:auto}.titleRow{align-items:flex-start;gap:8px;flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><div class="logo">GAIA</div><div><div class="subtitle">PivotAlphaDesk · Daily Zones</div><div style="font-size:11px;color:#6f7c91;margin-top:3px">Unified structural map</div></div></div><div class="livebox"><span class="dot"></span><span id="status">Connecting…</span><span id="lastUpdate"></span></div></header>
<div class="titleRow"><h1>DAILY ZONES</h1><span>SPX · NDX · SPY · QQQ · refresh 5s</span></div>
<div id="grid" class="grid"></div>
<footer><span>Fixed level colors: Call Wall · Put Wall · Gamma Flip · Gamma Node · Gravity Pin</span><span>Regime ✓ = engines agree · ⚠ = divergence</span><span>Equivalent Zone shown only for SPY→SPX and QQQ→NDX</span></footer>
</div>
<script>
const ENDPOINT='https://web-production-49e7.up.railway.app/daily_zones.json';
const symbols=['SPX','NDX','SPY','QQQ'];
function n(v,digits=2){if(v===null||v===undefined||Number.isNaN(Number(v)))return'—';const x=Number(v);const d=Math.abs(x)>=1000?2:digits;return x.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});}
function dirClass(s=''){s=s.toUpperCase();if(s.includes('BULL'))return'bull';if(s.includes('BEAR'))return'bear';return'neutral';}
function freshnessKey(sym){return sym==='SPX'?'spx':sym==='NDX'?'ndx':'etf';}
function freshText(sec){if(sec===null||sec===undefined)return'Freshness —';return`Fresh ${Number(sec).toFixed(1)}s`;}
function row(label,val,cls=''){return`<div class="row ${cls}"><strong>${label}</strong><span class="v">${n(val)}</span></div>`;}
function secondary(s={}){const items=[['GC2',s.gc2],['GC3',s.gc3],['GF2',s.gf2],['GF3',s.gf3]];return`<div class="secondary">${items.map(([k,v])=>`<div class="sec"><span>${k}</span><strong>${n(v)}</strong></div>`).join('')}</div>`;}
function card(sym,d,freshness){if(!d){return`<section class="card no-data"><div class="cardTop"><div><div class="symbol ${sym}">${sym}</div><div class="timestamp">NO DATA</div></div><div class="spot">—</div></div><div class="err">Source unavailable. Other cards remain live.</div></section>`;}const lp=d.levels||{},sec=d.secondary_levels||{};const same=(d.regime_pressure_map??'')===(d.regime_terminal_v10??'')&&d.regime_pressure_map!=null;const f=freshness?.[freshnessKey(sym)];const stale=Number(f)>15;const eq=d.equivalent_zone;return`<section class="card"><div class="cardTop"><div><div class="symbol ${sym}">${sym}</div><div class="timestamp">${d.timestamp??'—'}</div><div class="fresh ${stale?'stale':''}">${freshText(f)}${stale?' · STALE':''}</div></div><div class="spot">${n(d.spot)}</div></div><div class="regime"><div class="regimeBox"><div class="regimeLabel">Pressure Map</div><div class="regimeVal">${d.regime_pressure_map??'—'}</div></div><div class="regimeBox"><div class="regimeLabel">Terminal V10</div><div class="regimeVal">${d.regime_terminal_v10??'—'}</div></div><div class="agree ${same?'ok':'warn'}">${same?'✓ REGIME MATCH':'⚠ REGIME DIVERGENCE'}</div></div><div class="sectionTitle">Primary structure</div><div class="rows">${row('CALL WALL · GC1',lp.gc1,'wall-call')}${row('PUT WALL · GF1',lp.gf1,'wall-put')}${row('GAMMA FLIP · GP',lp.gp,'flip')}${row('GAMMA NODE',lp.node,'node')}${row('GRAVITY PIN',lp.pin,'pin')}</div><div class="sectionTitle">Dealer hedging pressure</div><div class="dhp"><div><div class="regimeLabel">NET DHP</div><div class="dhpVal">${n(d.net_dhp)}</div></div><div class="dir ${dirClass(d.dhp_direction)}">${d.dhp_direction??'—'}</div></div><div class="sectionTitle">Secondary levels</div>${secondary(sec)}${eq?`<div class="eq"><div class="eqLabel">Equivalent Zone · ${eq.symbol??'—'}</div><div class="eqVal">${n(eq.value)}</div></div>`:''}</section>`;}
async function load(){try{const r=await fetch(ENDPOINT,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json();document.getElementById('grid').innerHTML=symbols.map(s=>card(s,data[s],data.freshness_seconds||{})).join('');document.getElementById('status').textContent='LIVE';document.getElementById('lastUpdate').textContent=new Date().toLocaleTimeString();}catch(e){document.getElementById('status').textContent='DATA ERROR';document.getElementById('lastUpdate').textContent=e.message;}}
load();setInterval(load,5000);
</script>
</body>
</html>
